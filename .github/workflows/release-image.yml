name: Release server image

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: lapis-server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Publish ghcr.io/lapismd/lapis-server
    if: github.repository == 'lapismd/lapis-server'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out the published revision
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve the main commit tag
        id: short
        if: github.ref == 'refs/heads/main'
        run: echo "tag=$(git rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Resolve image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/lapismd/lapis-server
          tags: |
            type=ref,event=tag
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' }}
            type=raw,value=${{ steps.short.outputs.tag }},enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and publish the server image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: crates/lapis-server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
