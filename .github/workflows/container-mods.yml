name: Container Mods
on:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  packages: read
jobs:
  qualify:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: amd64
            runner: ubuntu-latest
          - architecture: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/.local/mod-loader-ci-target
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: crates/lapis-container-mods -> ../../.local/mod-loader-ci-target
      - run: cargo test --manifest-path crates/lapis-container-mods/Cargo.toml --locked
      - run: cargo clippy --manifest-path crates/lapis-container-mods/Cargo.toml --all-targets --locked -- -D warnings
      - uses: docker/setup-buildx-action@v3
      - run: docker buildx build --load --file docker/mod-loader/Dockerfile --tag lapis-mod-loader:qualification .
      - run: sh scripts/test-container-mods.sh
        env:
          LAPIS_MOD_TEST_AGENTS: codex cursor claude opencode
      - name: Export the qualified loader artifact
        run: |
          mkdir -p .local/mod-artifacts
          docker save lapis-mod-loader:qualification | gzip > .local/mod-artifacts/mod-loader-${{ matrix.architecture }}.docker.tar.gz
          docker save lapis-agent-mod:codex lapis-agent-mod:cursor lapis-agent-mod:claude lapis-agent-mod:opencode | gzip > .local/mod-artifacts/agent-mods-${{ matrix.architecture }}.docker.tar.gz
          docker buildx build --file docker/mod-loader/Dockerfile --output type=oci,dest=.local/mod-artifacts/mod-loader-${{ matrix.architecture }}.oci.tar .
      - uses: actions/upload-artifact@v7
        with:
          name: mod-loader-${{ matrix.architecture }}
          path: |
            .local/mod-artifacts/mod-loader-${{ matrix.architecture }}.docker.tar.gz
            .local/mod-artifacts/mod-loader-${{ matrix.architecture }}.oci.tar
            .local/mod-artifacts/agent-mods-${{ matrix.architecture }}.docker.tar.gz
