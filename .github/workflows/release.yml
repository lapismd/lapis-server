name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: lapis-server-release
  cancel-in-progress: false

jobs:
  changesets:
    name: Version the server package
    if: github.repository == 'lapismd/lapis-server' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - name: Check out main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Guard source-owned Node version inputs and release intent
        id: runtime
        uses: lapismd/lapis-ci/actions/guard-version-runtime@dc81ff65ba812bf005fb2a806eb3308bb8b5f71f
        with:
          qualification-file: scripts/dependency-automation/versioning-runtime.json
          detect-release-intent: "true"

      - name: Mint repository-scoped version PR token
        if: ${{ steps.runtime.outputs.hasChangesets == 'true' }}
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.LAPIS_DEPENDENCY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LAPIS_DEPENDENCY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write

      - name: Create or update the version pull request
        if: ${{ steps.runtime.outputs.hasChangesets == 'true' }}
        uses: changesets/action@63a615b9cd06ba9a3e6d13796c7fbcb080a60a0b # v1.8.0
        with:
          version: pnpm release:version
          publish: pnpm release:github
          commit: Version the server package
          title: Version the server package
          commitMode: github-api
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.app.outputs.token }}
          GH_TOKEN: ${{ github.token }}

      - name: Publish the existing GitHub release when no version intent remains
        if: ${{ steps.runtime.outputs.hasChangesets == 'false' }}
        run: pnpm release:github
        env:
          GH_TOKEN: ${{ github.token }}
