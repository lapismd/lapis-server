name: Release

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: lapis-server-release
  cancel-in-progress: false

jobs:
  changesets:
    name: Version the server package
    if: github.repository == 'lapismd/lapis-server'
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create or update the version pull request
        uses: changesets/action@v1.8.0
        with:
          version: pnpm release:version
          publish: pnpm release:github
          commit: Version the server package
          title: Version the server package
          commitMode: github-api
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
