name: Server CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: lapis-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  mod-loader:
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-mods.yml

  governance:
    name: Specification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm format:check
      - name: Cancel this run after a required failure
        if: "${{ failure() && !cancelled() }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  configure:
    name: Configure the server package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        name: Restore Rust dependency cache
        id: rust-cache
        with:
          workspaces: . -> .local/rust-core-target
          save-if: ${{ github.repository == 'lapismd/lapis-server' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm configure
      - run: pnpm test:demo
      - run: pnpm protocol:check
      - name: Validate root demo and example Compose profiles
        env:
          LAPIS_SERVER_CONFIG_FILE: /tmp/lapis-server-config.json
          LAPIS_SERVER_PASSWORD_FILE: /tmp/lapis-server-password.txt
        run: |
          docker compose --file docker-compose.yml config --quiet
          docker compose --file crates/lapis-server/compose.example.yaml config --quiet
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - name: Cancel this run after a required failure
        if: "${{ failure() && !cancelled() }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  image-tooling:
    needs: mod-loader
    name: Image tooling (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v8
        with:
          name: mod-loader-${{ matrix.architecture }}
          path: .local/mod-loader-artifact
      - name: Prepare the qualified loader build context
        run: |
          mkdir -p .local/mod-loader-layout
          tar -xf .local/mod-loader-artifact/mod-loader-${{ matrix.architecture }}.oci.tar -C .local/mod-loader-layout
      - name: Build the native server for the target architecture
        run: >-
          docker buildx build
          --platform linux/${{ matrix.architecture }}
          --target native
          --output type=cacheonly
          --file crates/lapis-server/Dockerfile
          .
      - name: Build and smoke-test the slim runtime
        run: |
          docker buildx build \
            --platform linux/${{ matrix.architecture }} \
            --target runtime \
            --build-context mod-loader=oci-layout://${{ github.workspace }}/.local/mod-loader-layout \
            --file crates/lapis-server/Dockerfile \
            --load --tag lapis-server-slim:${{ matrix.architecture }} .
          sh scripts/test-image-slim.sh lapis-server-slim:${{ matrix.architecture }}
      - name: Cancel this run after a required failure
        if: "${{ failure() && !cancelled() }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  rust:
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        name: Restore Rust dependency cache
        id: rust-cache
        with:
          workspaces: . -> .local/rust-core-target
          save-if: ${{ github.repository == 'lapismd/lapis-server' && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - name: Install pinned upstream JJ for repository fixtures
        run: node scripts/ci-setup-jj.mjs
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Cancel this run after a required failure
        if: "${{ failure() && !cancelled() }}"
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          curl --fail-with-body --silent --show-error --request POST
          --header "Authorization: Bearer $GH_TOKEN"
          --header "Accept: application/vnd.github+json"
          --header "X-GitHub-Api-Version: 2022-11-28"
          "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/cancel"

  renderer:
    name: Notes UI and production catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> .local/rust-core-target
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
      - name: Install upstream JJ for hosted fixtures
        run: node scripts/ci-setup-jj.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:startup-budget
      - name: Retain startup budget failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: startup-budget-diagnostics
          include-hidden-files: true
          path: |
            .local/startup-budget-*/failure.json
            .local/startup-budget-*/metrics.json
          if-no-files-found: ignore
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - run: pnpm test:storybook:static
      - run: pnpm test:hosted
