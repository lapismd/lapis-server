name: Server CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * *"

permissions:
  contents: read

concurrency:
  group: lapis-server-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LAPIS_CI_EVENT: ${{ github.event_name }}
  LAPIS_CI_PR_AUTHOR: ${{ github.event.pull_request.user.login }}
  LAPIS_CI_PR_AUTHOR_TYPE: ${{ github.event.pull_request.user.type }}
  LAPIS_CI_PR_HEAD: ${{ github.event.pull_request.head.ref }}
  LAPIS_DEPENDENCY_BOT_LOGIN: ${{ vars.LAPIS_DEPENDENCY_BOT_LOGIN }}

jobs:
  plan:
    name: Plan affected CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source: ${{ steps.plan.outputs.source }}
      plan: ${{ steps.plan.outputs.plan }}
      tooling: ${{ steps.plan.outputs.tooling }}
      configure: ${{ steps.plan.outputs.configure }}
      rust: ${{ steps.plan.outputs.rust }}
      rust_packages: ${{ steps.plan.outputs.rust_packages }}
      mod_loader: ${{ steps.plan.outputs.mod_loader }}
      renderer: ${{ steps.plan.outputs.renderer }}
      image_tooling: ${{ steps.plan.outputs.image_tooling }}
      cache_write: ${{ steps.plan.outputs.cache_write }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - run: node --test scripts/ci-plan.test.mjs scripts/ci-required.test.mjs
      - id: plan
        run: node scripts/ci-plan.mjs

  mod-loader:
    needs: plan
    if: needs.plan.outputs.mod_loader == 'true'
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/container-mods.yml
    with:
      source: ${{ needs.plan.outputs.source }}

  governance:
    needs: plan
    name: Specification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: taiki-e/install-action@v2
        with:
          tool: mdbook@0.5.4
      - run: pnpm install --frozen-lockfile
      - run: pnpm spec:check
      - run: pnpm format:check

  tooling:
    needs: plan
    if: needs.plan.outputs.tooling == 'true'
    name: Affected Node tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:dependency-intake
      - run: node --test scripts/cli-distribution.test.mjs scripts/version-pr-auth.test.mjs

  configure:
    needs: plan
    if: needs.plan.outputs.configure == 'true'
    name: Configure the server package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        name: Restore Rust dependency cache
        id: rust-cache
        with:
          workspaces: . -> .local/rust-core-target
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
      - run: pnpm install --frozen-lockfile
      - run: pnpm configure
      - run: pnpm test:demo
      - run: pnpm protocol:check
      - name: Validate root demo and example Compose profiles
        env:
          LAPIS_SERVER_CONFIG_FILE: /tmp/lapis-server-config.json
          LAPIS_SERVER_PASSWORD_FILE: /tmp/lapis-server-password.txt
        run: |
          docker compose --file docker-compose.yml config --quiet
          docker compose --file crates/lapis-server/compose.example.yaml config --quiet
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}

  image-tooling:
    needs: [plan, mod-loader]
    if: needs.plan.outputs.image_tooling == 'true'
    name: Image tooling (${{ matrix.architecture }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        architecture: [amd64, arm64]
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v8
        with:
          name: mod-loader-${{ matrix.architecture }}
          path: .local/mod-loader-artifact
      - name: Prepare the qualified loader build context
        run: |
          mkdir -p .local/mod-loader-layout
          tar -xf .local/mod-loader-artifact/mod-loader-${{ matrix.architecture }}.oci.tar -C .local/mod-loader-layout
      - name: Build the native server for the target architecture
        run: >-
          docker buildx build
          --platform linux/${{ matrix.architecture }}
          --target native
          --output type=cacheonly
          --file crates/lapis-server/Dockerfile
          .
      - name: Build and smoke-test the slim runtime
        run: |
          docker buildx build \
            --platform linux/${{ matrix.architecture }} \
            --target runtime \
            --build-context mod-loader=oci-layout://${{ github.workspace }}/.local/mod-loader-layout \
            --file crates/lapis-server/Dockerfile \
            --load --tag lapis-server-slim:${{ matrix.architecture }} .
          sh scripts/test-image-slim.sh lapis-server-slim:${{ matrix.architecture }}

  rust:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    name: Rust tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: "1"
      LAPIS_CI_RUST_PACKAGES: ${{ needs.plan.outputs.rust_packages }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        name: Restore Rust dependency cache
        id: rust-cache
        with:
          workspaces: . -> .local/rust-core-target
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          cache-on-failure: "false"
      - name: Report Rust cache match
        run: 'echo "Rust cache exact hit: $CACHE_HIT" >> "$GITHUB_STEP_SUMMARY"'
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
      - name: Install pinned upstream JJ for repository fixtures
        run: node scripts/ci-setup-jj.mjs
      - run: node scripts/ci-rust.mjs

  renderer:
    needs: plan
    if: needs.plan.outputs.renderer == 'true'
    name: Notes UI and production catalog
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: . -> .local/rust-core-target
          key: ordinary-1.99-debug
          cache-workspace-crates: "false"
          save-if: ${{ needs.plan.outputs.cache_write == 'true' }}
          cache-on-failure: "false"
      - name: Install upstream JJ for hosted fixtures
        run: node scripts/ci-setup-jj.mjs
      - run: pnpm check
      - run: pnpm test
      - run: pnpm build
      - run: pnpm test:startup-budget
      - name: Retain startup budget failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: startup-budget-diagnostics
          include-hidden-files: true
          path: |
            .local/startup-budget-*/failure.json
            .local/startup-budget-*/metrics.json
          if-no-files-found: ignore
      - run: pnpm test:storybook
      - run: pnpm build-storybook
      - run: pnpm test:storybook:static
      - run: pnpm test:hosted
      - run: pnpm test:plugin-operations
      - name: Retain hosted Tasks failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-tasks-failure-diagnostics
          path: test-results/rust-hosted-tasks/
          if-no-files-found: ignore
          retention-days: 7

  required:
    name: Required Server CI
    if: always()
    needs:
      - plan
      - governance
      - tooling
      - configure
      - mod-loader
      - image-tooling
      - rust
      - renderer
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.plan.outputs.source }}
          fetch-depth: 0
          persist-credentials: false
      - run: node scripts/ci-required.mjs
        env:
          LAPIS_CI_PLAN: ${{ needs.plan.outputs.plan }}
          LAPIS_CI_JOBS: ${{ toJSON(needs) }}
