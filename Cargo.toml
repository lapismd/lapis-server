[workspace]
members = ["crates/lapis-app-core", "crates/lapis-app-protocol", "crates/lapis-content-http", "crates/lapis-content-mcp", "crates/lapis-cli", "crates/lapis-server", "crates/lapis-plugin-jobs"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

# Compiled plugin adapters use the same Core/Protocol instances as this host.
[patch."https://github.com/lapismd/lapis-server"]
lapis-app-core = { path = "crates/lapis-app-core" }
lapis-app-protocol = { path = "crates/lapis-app-protocol" }

[profile.dev]
debug = 0
incremental = false

[profile.test]
debug = 0
incremental = false

[profile.dev.package.scrypt]
opt-level = 3
