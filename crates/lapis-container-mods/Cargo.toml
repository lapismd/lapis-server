[package]
name = "lapis-container-mods"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
publish = false

[[bin]]
name = "mod-loader"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
docker_credential = "1.4.0"
flate2 = "1"
fs2 = "0.4"
libc = "0.2"
oci-client = { version = "0.18.0", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "time"] }

[dev-dependencies]
axum = "0.8"

[workspace]
resolver = "3"

[profile.release]
strip = true
