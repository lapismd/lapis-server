[package]
name = "lapis-content-http"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared content HTTP adapter for Lapis Server and Desktop"

[dependencies]
lapis-app-core = { path = "../lapis-app-core" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "original-uri", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
serde_json = "1"
