[package]
name = "lapis-plugin-jobs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Bounded headless plugin execution and calendar scheduling"

[features]
default = ["engine"]
engine = ["dep:rquickjs"]

[dependencies]
chrono = "0.4"
chrono-tz = "0.10"
rquickjs = { version = "=0.14.0", optional = true, default-features = false, features = ["std"] }
schemars = "=1.2.3"
ts-rs = { version = "=12.0.1", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

