[package]
name = "lapis-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Lapis content CLI client"

[[bin]]
name = "lapis"
path = "src/main.rs"

[dependencies]
lapis-app-protocol = { path = "../lapis-app-protocol" }
clap = { version = "=4.6.7", features = ["derive"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
reqwest-mcp = { package = "reqwest", version = "=0.13.5", default-features = false, features = ["rustls"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "client", "transport-streamable-http-client-reqwest", "transport-io"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs", "process"] }

[dev-dependencies]
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
lapis-app-core = { path = "../lapis-app-core" }
lapis-content-http = { path = "../lapis-content-http" }
lapis-content-mcp = { path = "../lapis-content-mcp" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
tempfile = "=3.27.0"
tokio = { version = "1", features = ["process", "io-util", "net", "time"] }
