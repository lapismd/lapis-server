[package]
name = "lapis-app-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport-independent native application services for Lapis Notes"

[features]
# The historical feature name selects pinned Git engines, never sibling paths.
default = ["local-sibling-projections"]
local-sibling-projections = []
mobile-database = ["dep:lapis-app-protocol", "dep:serde_json", "dep:turso", "dep:tokio", "dep:base64", "dep:chrono", "dep:icu_collator", "dep:regress"]

[dependencies]
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
rustix = { version = "=1.1.6", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "serde"] }

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
lapis-plugin-jobs = { path = "../lapis-plugin-jobs" }
jj-forge = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0", default-features = false }
jj-store-service = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0", default-features = false }
lapis-terminal-service = { git = "https://github.com/lapismd/terminal-host", rev = "88fae24eb24934bb8dcc8bdf2eb0f1e86ffb39ef", version = "0.1.0" }
lapis-plugin-services = { git = "https://github.com/lapismd/lapis-plugins", rev = "9f2713ac6a4f40ff48325620d969de08fb31f5aa", version = "0.1.0" }
lapis-task-services = { git = "https://github.com/lapismd/lapis-plugin-tasks", rev = "bdb1e5834c3b1e335b2fd5e9f96bfd54dc8b2439", version = "0.1.0" }
lapis-docs-projection = { git = "https://github.com/lapismd/lapis-plugin-docs", rev = "f772f2bacc20a914cef2f0398f294cefbac4ba3c", version = "0.0.0" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
lapis-ai-service = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0" }
async-trait = "0.1"
jj-history-service = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0" }
jj-store-model = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0" }
md5 = "=0.8.0"
sha2 = "=0.10.9"
same-file = "=1.0.6"
getrandom = "=0.4.3"
subtle = "=2.6.1"
zeroize = { version = "=1.9.1", features = ["serde"] }
tempfile = "=3.27.0"
serde_json = "1"
jsonschema = { version = "=0.33.0", default-features = false }
serde_yaml = "=0.9.34"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "net", "time"] }
turso = { version = "=0.7.2", default-features = false, features = ["fts"] }
base64 = "=0.22.1"
icu_collator = "=2.4.0"
chrono = "0.4"
regress = { version = "=0.12.0", features = ["utf16", "prohibit-unsafe"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
hickory-resolver = { version = "=0.26.4", default-features = false, features = ["tokio", "system-config"] }
jj-vault = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0" }
jj-store-jj = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0", default-features = false, features = ["vault-backup"] }
notify = "=8.2.0"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
lapis-app-protocol = { path = "../lapis-app-protocol", optional = true }
serde_json = { version = "1", optional = true }
turso = { version = "=0.7.2", default-features = false, features = ["fts"], optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"], optional = true }
base64 = { version = "=0.22.1", optional = true }
chrono = { version = "0.4", optional = true }
icu_collator = { version = "=2.4.0", optional = true }
regress = { version = "=0.12.0", features = ["utf16", "prohibit-unsafe"], optional = true }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[[test]]
name = "native_indexing_authority"
required-features = ["local-sibling-projections"]

[[test]]
name = "native_indexing_contributions"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_daily_task_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_daily_task_reference"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_indexing"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_markdown_parser_upgrade"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_search_controls"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_search_sources"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_lifecycle"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_lifecycle_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_occurrences"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_write_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_writes"
required-features = ["local-sibling-projections"]
