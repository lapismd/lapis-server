[package]
name = "lapis-app-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Transport-independent native application services for Lapis Notes"

[features]
# The historical feature name selects pinned Git engines, never sibling paths.
default = ["local-sibling-projections"]
local-sibling-projections = []

[dependencies]
lapis-plugin-services = { git = "https://github.com/lapismd/lapis-plugins", rev = "879581d1549187bdbac2d75b40d02e0df46e721a", version = "0.1.0" }
lapis-task-services = { git = "https://github.com/lapismd/lapis-plugin-tasks", rev = "52270c2aa7838811604a20be0861cdbd04027b42", version = "0.1.0" }
lapis-docs-projection = { git = "https://github.com/lapismd/lapis-plugin-docs", rev = "f772f2bacc20a914cef2f0398f294cefbac4ba3c", version = "0.0.0" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
lapis-ai-service = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0" }
async-trait = "0.1"
jj-history-service = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
jj-store-model = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
cap-std = "=4.0.3"
cap-tempfile = "=4.0.3"
libc = "0.2"
md5 = "=0.8.0"
rustix = { version = "=1.1.5", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
sha2 = "=0.10.9"
uuid = { version = "1", features = ["v4"] }
tempfile = "=3.27.0"
serde_json = "1"
serde_yaml = "=0.9.34"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros"] }
turso = { version = "=0.7.2", default-features = false, features = ["fts"] }
base64 = "=0.22.1"
icu_collator = "=2.4.0"
chrono = "0.4"
regress = { version = "=0.12.0", features = ["utf16", "prohibit-unsafe"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] }
tokenizers = { version = "=0.22.2", default-features = false, features = ["fancy-regex"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }
jj-vault = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0" }
jj-store-jj = { git = "https://github.com/stevejuma/jj-store", rev = "7a98bd89d2bc77fb6ec41f91186992abb19ba161", version = "0.1.0", default-features = false, features = ["vault-backup"] }
notify = "=8.2.0"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "time"] }

[[test]]
name = "native_indexing_authority"
required-features = ["local-sibling-projections"]

[[test]]
name = "native_indexing_contributions"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_daily_task_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_daily_task_reference"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_indexing"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_markdown_parser_upgrade"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_search_controls"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_search_sources"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_lifecycle"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_lifecycle_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_occurrences"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_write_guards"
required-features = ["local-sibling-projections"]

[[test]]
name = "service_task_writes"
required-features = ["local-sibling-projections"]
