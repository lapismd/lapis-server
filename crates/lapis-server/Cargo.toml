[package]
name = "lapis-server"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Hosted HTTP adapter for shared Lapis native application services"
default-run = "lapis-server"

[features]
local-sibling-projections = []

[dependencies]
schemars = "=1.2.3"
jj-vault = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0" }
jj-forge = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0", default-features = false }
cap-std = "=4.0.3"
aes-gcm = { version = "=0.10.3", features = ["zeroize"] }
zeroize = "=1.9.1"
url = "2"
utoipa-swagger-ui = { version = "=10.0.2", default-features = false, features = ["vendored"] }
webauthn-rs = { version = "=0.5.5", default-features = false }
lapis-task-operations = { git = "https://github.com/lapismd/lapis-plugin-tasks", rev = "bdb1e5834c3b1e335b2fd5e9f96bfd54dc8b2439" }
lapis-content-http = { path = "../lapis-content-http" }
lapis-content-mcp = { path = "../lapis-content-mcp" }
lapis-app-core = { path = "../lapis-app-core" }
lapis-ai-service = { git = "https://github.com/lapismd/lapis-ai", tag = "v0.2.0", version = "0.2.0" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
futures-util = { version = "=0.3.34", default-features = false, features = ["std"] }
mime_guess = "=2.0.5"
tempfile = "=3.27.0"
tokio-util = { version = "=0.7.20", features = ["io"] }
subtle = "=2.6.1"
base64 = "=0.22.1"
getrandom = "=0.4.3"
scrypt = { version = "=0.11.0", default-features = false, features = ["std"] }
turso = { version = "=0.7.2", default-features = false }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "time", "fs", "io-util", "sync"] }
uuid = { version = "1", features = ["v4", "serde"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "stream"] }

[dev-dependencies]
async-trait = "0.1"
zip = { version = "=9.1.0", default-features = false, features = ["deflate-flate2-zlib-rs"] }
jj-store-jj = { git = "https://github.com/stevejuma/jj-store", rev = "086def182eae2ab6e5dc39aba030390d7ea8612c", version = "0.2.0", default-features = false, features = ["vault-backup"] }
reqwest = { version = "=0.12.28", default-features = false, features = ["json", "stream"] }
tokio = { version = "1", features = ["process", "io-util", "time"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Link the same cryptography into both architectures of the server image.
openssl = { version = "=0.10.82", features = ["vendored"] }
