[package]
name = "lapis-content-mcp"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Shared read-only MCP adapter for Lapis Server and Desktop"

[dependencies]
lapis-app-core = { path = "../lapis-app-core" }
lapis-app-protocol = { path = "../lapis-app-protocol" }
lapis-content-http = { path = "../lapis-content-http" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "original-uri", "tokio"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-streamable-http-server"] }
schemars = "=1.2.3"
serde_json = "1"
percent-encoding = "2"
tokio = { version = "1", features = ["sync", "time"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "=3.27.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "stream"] }
rmcp = { version = "=3.9.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time"] }
futures-util = "0.3"
tower = { version = "0.5", features = ["util"] }

